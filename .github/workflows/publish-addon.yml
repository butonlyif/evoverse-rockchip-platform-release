name: Publish verified Application Toolchain Add-on

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        default: application-toolchain-2026.11.27-candidate.1

permissions:
  contents: write

concurrency:
  group: platform-addon-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_OWNER: but-only-if
      GITEE_REPO: evoverse-rockchip-platform-release
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      PLATFORM_RELEASE_SIGN_KEY: ${{ secrets.PLATFORM_RELEASE_SIGN_KEY }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signing dependency
        run: python -m pip install cryptography==49.0.0
      - name: Download draft and verify all promised bytes
        run: |
          mkdir assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D assets
          python -m scripts.verify_addon_assets assets/application-toolchain-addon-input.json assets
      - name: Sign addon descriptor and check public key
        run: |
          python -m scripts.sign_addon sign assets/application-toolchain-addon-input.json \
            --output assets/application-toolchain-addon.json
          python -m scripts.sign_addon verify assets/application-toolchain-addon.json
      - name: Prepare Gitee signed index and verify local closure
        run: |
          python -m scripts.index_manifest assets/application-toolchain-addon.json "$TAG" shards/index-manifest.json --kind addon
          python scripts/publish_gitee_shards.py \
            --shards-manifest shards/index-manifest.json --assets-dir assets --tag "$TAG" \
            --target-commitish master
      - name: Add signed metadata to GitHub draft
        run: |
          file="assets/application-toolchain-addon.json"
          name="$(basename "$file")"
          expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
          actual="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$name\") | .digest")"
          if [ -z "$actual" ]; then
            gh release upload "$TAG" "$file" -R "$GITHUB_REPOSITORY"
          elif [ "$actual" != "$expected" ]; then
            echo "Existing $name has different digest" >&2
            exit 1
          fi
      - name: Publish and redownload Gitee signed index
        run: |
          python scripts/publish_gitee_shards.py \
            --shards-manifest shards/index-manifest.json --assets-dir assets --tag "$TAG" \
            --target-commitish master --evidence gitee-publish-evidence.json --yes
      - name: Publish GitHub addon after both channels verify
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=true
      - name: Record channel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-addon-publish-evidence
          path: gitee-publish-evidence.json
          if-no-files-found: ignore
