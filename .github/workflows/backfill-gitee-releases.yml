name: Backfill SDK and Catalog Gitee releases

on:
  workflow_dispatch:
    inputs:
      product:
        description: Public release to mirror
        required: true
        type: choice
        options: [sdk, catalog]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: but-only-if
      PRODUCT: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select existing public release
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCT" in
            sdk)
              echo 'TAG=v1.0.1' >> "$GITHUB_ENV"
              echo 'SOURCE_REPO=butonlyif/evoverse-sdk-releases' >> "$GITHUB_ENV"
              echo 'GITEE_REPO=evoverse-sdk-releases' >> "$GITHUB_ENV"
              ;;
            catalog)
              echo 'TAG=catalog-v0.9.8' >> "$GITHUB_ENV"
              echo 'SOURCE_REPO=butonlyif/evoverse-catalog-release' >> "$GITHUB_ENV"
              echo 'GITEE_REPO=evoverse-catalog-release' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Download and verify GitHub assets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITEE_TOKEN"
          mkdir input
          gh release download "$TAG" -R "$SOURCE_REPO" -D input
          gh release view "$TAG" -R "$SOURCE_REPO" --json assets > github-assets.json
          python scripts/prepare_gitee_backfill.py "$PRODUCT" "$TAG" input github-assets.json upload
          python scripts/publish_gitee_shards.py \
            --shards-manifest upload/publish-manifest.json --assets-dir upload \
            --tag "$TAG" --target-commitish master
      - name: Publish and verify Gitee release
        shell: bash
        run: |
          python scripts/publish_gitee_shards.py \
            --shards-manifest upload/publish-manifest.json --assets-dir upload \
            --tag "$TAG" --target-commitish master \
            --evidence gitee-backfill-evidence.json --yes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitee-${{ inputs.product }}-backfill-evidence
          path: gitee-backfill-evidence.json
          if-no-files-found: ignore
